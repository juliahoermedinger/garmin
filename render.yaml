services:
  - type: web
    name: running-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        sync: false
      - key: GARMIN_TOKEN_ENC_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
